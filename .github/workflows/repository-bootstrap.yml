name: Repository bootstrap checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Repository documentation smoke checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required repository documents
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md GETTING_STARTED.md LEARNING_PATHS.md CONTRIBUTING.md SECURITY.md DATA_HANDLING_POLICY.md LICENSE; do
            test -s "$file"
          done
      - name: Check whitespace errors
        run: git diff --check
