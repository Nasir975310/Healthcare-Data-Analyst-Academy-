<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v5.37 Application Execution Roadmap</title>
<style>body{font:16px system-ui;max-width:900px;margin:2rem auto;padding:0 1rem;line-height:1.5}header,section{border:1px solid #8888;border-radius:12px;padding:1rem;margin:1rem 0}.bar{height:12px;background:#8884;border-radius:9px;overflow:hidden}.fill{height:100%;width:0;background:#27866b}.task{display:flex;gap:.7rem;padding:.45rem 0}button{padding:.5rem;border:1px solid #8888;border-radius:8px;background:transparent;color:inherit}.muted{opacity:.7}</style></head><body>
<header><h1>Application execution roadmap</h1><p>v5.37.0 · From role selection to evidence-backed applications.</p><strong id="count">0 / 10 complete</strong><div class="bar"><div class="fill" id="fill"></div></div><p class="muted">Saved in this browser only. Export progress for backup.</p><button id="export">Export JSON</button> <button id="reset">Reset</button></header><div id="tasks"></div>
<script>
const groups={"Role targeting":["Choose 2–3 realistic target role families","Screen one real vacancy for mandatory requirements and red flags","Map every relevant requirement to a verified evidence artifact"],"Portfolio and assessment":["Run the SQL assessment against the included SQLite fixture","Complete the Python profiling and reconciliation tasks","Rehearse the five-minute portfolio walkthrough and score it"],"Application execution":["Tailor one truthful CV to a specific vacancy","Submit and record 8–12 carefully matched applications","Record two interview answers and review weak areas","Review weekly funnel metrics and define one adjustment"]};
const key="hda-v537-progress";let state={};try{state=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){}
const host=document.getElementById("tasks");let total=0;
for(const [name,tasks] of Object.entries(groups)){const s=document.createElement("section");const h=document.createElement("h2");h.textContent=name;s.append(h);
tasks.forEach(t=>{const id=String(total++);const l=document.createElement("label");l.className="task";const c=document.createElement("input");c.type="checkbox";c.checked=!!state[id];c.onchange=()=>{state[id]=c.checked;save()};const span=document.createElement("span");span.textContent=t;l.append(c,span);s.append(l)});host.append(s)}
function save(){localStorage.setItem(key,JSON.stringify(state));update()}
function update(){const n=Object.values(state).filter(Boolean).length;document.getElementById("count").textContent=n+" / "+total+" complete";document.getElementById("fill").style.width=(n/total*100)+"%"}
document.getElementById("export").onclick=()=>{const b=new Blob([JSON.stringify({version:"5.37.0",state},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="hda-v537-progress.json";a.click();URL.revokeObjectURL(a.href)};
document.getElementById("reset").onclick=()=>{if(confirm("Reset this roadmap?")){state={};save();location.reload()}};update();
</script></body></html>
