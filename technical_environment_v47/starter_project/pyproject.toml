[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "health-analytics-starter"
version = "0.1.0"
description = "Reproducible healthcare analytics training project using synthetic data"
requires-python = ">=3.10"
dependencies = ["pandas>=2.1,<4", "numpy>=1.26,<3", "matplotlib>=3.8,<4", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1", "jupyterlab>=4,<5", "ipykernel>=6,<7"]
postgres = ["psycopg[binary]>=3.2,<4", "sqlalchemy>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
