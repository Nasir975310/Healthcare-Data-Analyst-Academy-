services:
  postgres:
    image: postgres:16
    container_name: hda-training-postgres
    environment:
      POSTGRES_DB: healthcare_training
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: local_training_only_change_me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hda_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d healthcare_training"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  hda_pgdata:
