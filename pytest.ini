[pytest]
# The academy contains many historical standalone exercises with repeated test
# module names and local import conventions. Root pytest intentionally runs the
# maintained release-gate suites; older project suites are run from their own
# module folders as documented in each module README.
testpaths =
    career_launch_kit_v555/tests
    application_intelligence_v556/tests
    application_execution_interview_v557/tests
    application_performance_career_intelligence_v558/tests
    job_search_source_vacancy_verification_v559/tests
    vacancy_sourcing_evidence_capture_v560/tests
addopts = --import-mode=importlib --ignore=dashboard_uat_v550/tests/test_dashboard_browser.py
