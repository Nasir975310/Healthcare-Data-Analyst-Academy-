<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v5.44 Portfolio Release Candidate Roadmap</title><style>body{font:16px system-ui;max-width:900px;margin:32px auto;padding:0 18px;background:#101827;color:#e8eef8}h1{font-size:1.8rem}.muted{color:#a9b8ce}.item{display:flex;gap:12px;padding:14px;margin:10px 0;background:#1b2940;border:1px solid #34445f;border-radius:12px}.item input{width:20px;height:20px}.tag{font-size:.8rem;color:#a9b8ce}.bar{height:10px;background:#34445f;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;width:0;background:#4ade80}button{padding:9px 14px;border:0;border-radius:8px;background:#334c70;color:white;margin:10px 8px 10px 0}</style></head><body><h1>Portfolio Release Candidate — v5.44.0</h1><p class="muted">Local release readiness is distinct from remote publication and human review. Check items only after completing them.</p><div class="bar"><span id="progress"></span></div><p id="count" class="muted">0 of 9 complete</p><div id="tasks"></div><button id="reset">Reset checklist</button><script>
const tasks=[['Review project scope','Read README, case study, metric contract and limitations.','LOCAL'],['Run candidate builder','Verify manifest, scan, tests and pipeline.','LOCAL'],['Inspect archive','Check ZIP integrity, file list and SHA-256.','LOCAL'],['Fresh-directory reproduction','Extract ZIP elsewhere; rerun tests and pipeline.','LOCAL'],['Manual privacy and provenance review','Inspect every file; scanner is heuristic.','HUMAN'],['License and repository decision','Confirm rights and choose a dedicated repository.','HUMAN'],['Publish and run remote CI','Capture URL, commit SHA and successful workflow.','EXTERNAL'],['Remote clean-clone reproduction','Clone the published commit and retain test-log hash.','EXTERNAL'],['Independent review and evidence gate','Complete v5.43 evidence JSON; assess without fabricated proof.','HUMAN']];
const key='hda-v544-roadmap';let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){};const root=document.getElementById('tasks');tasks.forEach((t,i)=>{const d=document.createElement('label');d.className='item';const c=document.createElement('input');c.type='checkbox';c.checked=!!state[i];c.addEventListener('change',()=>{state[i]=c.checked;save()});const s=document.createElement('span');s.innerHTML='<strong>'+t[0]+'</strong><br><span class="muted">'+t[1]+'</span><br><span class="tag">'+t[2]+'</span>';d.append(c,s);root.append(d)});function save(){localStorage.setItem(key,JSON.stringify(state));const n=Object.values(state).filter(Boolean).length;document.getElementById('progress').style.width=(n/tasks.length*100)+'%';document.getElementById('count').textContent=n+' of '+tasks.length+' complete'}document.getElementById('reset').onclick=()=>{state={};root.querySelectorAll('input').forEach(x=>x.checked=false);save()};save();
</script></body></html>
