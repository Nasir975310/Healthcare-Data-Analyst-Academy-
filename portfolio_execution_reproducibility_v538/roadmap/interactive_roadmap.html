<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v5.38 Portfolio Execution Roadmap</title><style>body{font:16px system-ui;max-width:900px;margin:2rem auto;padding:0 1rem;line-height:1.5}header,section{border:1px solid #8888;border-radius:12px;padding:1rem;margin:1rem 0}.bar{height:12px;background:#8884;border-radius:9px;overflow:hidden}.fill{height:100%;width:0;background:#27866b}.task{display:flex;gap:.7rem;padding:.5rem 0}button{padding:.5rem .8rem;border:1px solid #8888;border-radius:8px;background:transparent;color:inherit}.muted{opacity:.7}</style></head><body><header><h1>Portfolio execution roadmap</h1><p>v5.38.0 · Build, test, document and review one complete synthetic healthcare analytics project.</p><strong id="count">0 / 8 complete</strong><div class="bar"><div class="fill" id="fill"></div></div><p class="muted">Progress is saved in this browser only. Export a backup.</p><button id="export">Export progress</button> <button id="reset">Reset</button></header><div id="tasks"></div><script>
const groups={"Build and reproduce":["Run the project from its documented commands","Inspect source-to-output row reconciliation","Review department metrics and denominators"],"Quality and publication":["Run all five automated tests","Run repository preflight and manually inspect findings","Complete repository release checklist"],"Present and review":["Write the case study using the included template","Rehearse a five-minute portfolio walkthrough and record reviewer feedback"]};
const key="hda-v538-progress";let state={};try{state=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){}let total=0;const host=document.getElementById("tasks");
for(const [name,tasks] of Object.entries(groups)){const sec=document.createElement("section");const h=document.createElement("h2");h.textContent=name;sec.append(h);tasks.forEach(t=>{const id=String(total++);const l=document.createElement("label");l.className="task";const c=document.createElement("input");c.type="checkbox";c.checked=!!state[id];c.onchange=()=>{state[id]=c.checked;save()};const span=document.createElement("span");span.textContent=t;l.append(c,span);sec.append(l)});host.append(sec)}
function save(){localStorage.setItem(key,JSON.stringify(state));update()}function update(){const n=Object.values(state).filter(Boolean).length;document.getElementById("count").textContent=n+" / "+total+" complete";document.getElementById("fill").style.width=(n/total*100)+"%"}
document.getElementById("export").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({version:"5.38.0",state},null,2)],{type:"application/json"}));a.download="hda-v538-progress.json";a.click();URL.revokeObjectURL(a.href)};document.getElementById("reset").onclick=()=>{if(confirm("Reset roadmap progress?")){state={};save();location.reload()}};update();
</script></body></html>
